[project]
name = "embroiderly"
version = "0.1.0"
description = "Deterministic, audit-first embroidery digitising"
requires-python = ">=3.11"
dependencies = [
  "pyembroidery>=1.5.1", "Flask>=3", "Pillow>=10", "numpy>=1.26",
  "opencv-python-headless>=4.9", "scikit-image>=0.23", "shapely>=2.0", "fonttools>=4.0",
  "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# "Let Claude decide" in Digitize for me; needs ANTHROPIC_API_KEY.
ai = ["anthropic>=1.0"]

[tool.setuptools.package-data]
embroiderly = ["fonts/*/*", "templates/*", "static/*", "static/**/*", "knowledge/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
